# Local SonarQube wired to the same Docker network as the Jenkins container
# (circleguard-jenkins lives on circle-guard-public_circleguard).
#
# Start:
#   docker compose -f compose.sonar.yml up -d
# UI:
#   http://localhost:9000   (default login admin / admin — change on first login)
# From Jenkins pipeline:
#   SONAR_HOST_URL=http://sonarqube:9000
#
# Project key (matches Jenkinsfile env): cicd-demo
services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube-cicd-demo
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      circleguard:
        aliases:
          - sonarqube
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  circleguard:
    external: true
    name: circle-guard-public_circleguard
